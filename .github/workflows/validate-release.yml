name: Validar release SmartRisk

on:
  push:
    branches:
      - "**"
    paths:
      - "preview-rc14.4.4/**"
      - "pilot-baseline-data.js"
      - "pilot-baseline-bridge.js"
      - "RELEASE_MANIFEST.json"
      - "scripts/**"
      - "firestore.rules"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "preview-rc14.4.4/**"
      - "pilot-baseline-data.js"
      - "pilot-baseline-bridge.js"
      - "RELEASE_MANIFEST.json"
      - "scripts/**"
      - "firestore.rules"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validar manifiesto, línea base y paquetes de datos
        run: node scripts/validate-release.mjs

      - name: Validar coherencia del panel científico
        run: node scripts/validate-scientific-quality-fix.mjs

      - name: Validar recepción y estados diferenciados de planes
        run: node scripts/validate-plan-receipt-status.mjs

      - name: Auditar todas las páginas y cruces de datos
        run: node scripts/audit-full-platform-20260731.mjs

      - name: Conservar informe de auditoría
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-integral-smartrisk-20260731
          path: AUDIT_FULL_PLATFORM_20260731.json
          if-no-files-found: warn

      - name: Conservar fuentes auditadas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuentes-auditadas-smartrisk-20260731
          path: |
            app.js
            data.js
            enos-data.js
            enos-reviews.js
            risk-locations.js
            f03-data.js
            cases-data.js
            pilot-baseline-data.js
            pilot-baseline-bridge.js
            RELEASE_MANIFEST.json
            firestore.rules
            preview-rc14.4.4/*.js
            preview-rc14.4.4/index.html
            scripts/*.mjs
          if-no-files-found: error

      - name: Revisar sintaxis JavaScript
        run: |
          node --check preview-rc14.4.4/access-gate-preview.js
          node --check preview-rc14.4.4/latest-data-update.js
          node --check preview-rc14.4.4/followup-completion-20260730.js
          node --check preview-rc14.4.4/los-rios-plan-correction-20260730.js
          node --check preview-rc14.4.4/scientific-quality-fix-20260731.js
          node --check preview-rc14.4.4/plan-receipt-status-fix-20260731.js
          node --check preview-rc14.4.4/action-r023-core.js
          node --check preview-rc14.4.4/action-r023-page.js
          node --check preview-rc14.4.4/action-r023-form.js

      - name: Verificar que no existan marcadores de conflicto
        run: |
          ! grep -R -n -E '^(<<<<<<<|=======|>>>>>>>)' \
            preview-rc14.4.4 RELEASE_MANIFEST.json scripts firestore.rules .github/workflows