name: Patch first password change flow

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/patch-first-password-change.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch first-login flow and cache key
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          gate = Path('access-gate.js')
          text = gate.read_text(encoding='utf-8')
          old_version = 'const ACCESS_VERSION = "2026.08.24.2";'
          new_version = 'const ACCESS_VERSION = "2026.08.31.3";'
          old_flow = 'const temporaryCredentialFlow = profile.requiereCambioClave === true && normalizeText(profile.metodoActivacion) === "credencial temporal";'
          new_flow = 'const activationMethod = normalizeText(profile.metodoActivacion);\n    const temporaryCredentialFlow = profile.requiereCambioClave === true && ["credencial temporal", "credencial inicial administrada"].includes(activationMethod);'
          if old_flow not in text:
              raise SystemExit('No se encontró la condición original de cambio de clave')
          text = text.replace(old_version, new_version).replace(old_flow, new_flow)
          gate.write_text(text, encoding='utf-8')

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          old_src = 'access-gate.js?v=11.0.0-rc16.7'
          new_src = 'access-gate.js?v=2026.08.31.3'
          if old_src not in html:
              raise SystemExit('No se encontró la referencia original de access-gate.js')
          index.write_text(html.replace(old_src, new_src), encoding='utf-8')
          PY
          node --check access-gate.js
          git diff --check
          grep -n "temporaryCredentialFlow\|access-gate.js?v=2026.08.31.3" access-gate.js index.html

      - name: Commit production patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SmartRisk release automation"
          git config user.email "actions@users.noreply.github.com"
          git add access-gate.js index.html
          git commit -m "Enforce first password change for managed initial credentials"
          git push origin HEAD:main
