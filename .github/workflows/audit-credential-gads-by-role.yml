name: Audit credential GAD coverage by role

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/audit-credential-gads-by-role.yml"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_SMARTRISK_CZ5_PRODUCCION }}"
      - name: Build sanitized institutional coverage
        env:
          FIREBASE_PROJECT_ID: smartrisk-cz5-produccion
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/smartrisk-role-audit
          cd /tmp/smartrisk-role-audit
          npm init -y >/dev/null 2>&1
          npm install --silent firebase-admin@13
          export NODE_PATH=/tmp/smartrisk-role-audit/node_modules
          cd "$GITHUB_WORKSPACE"
          node <<'NODE'
          const fs=require('fs');
          const admin=require('firebase-admin');
          admin.initializeApp({credential:admin.credential.applicationDefault(),projectId:process.env.FIREBASE_PROJECT_ID});
          const db=admin.firestore();
          const norm=v=>String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toUpperCase();
          (async()=>{
            const snap=await db.collection('perfiles').get();
            const map=new Map();
            for(const d of snap.docs){
              const p=d.data()||{};
              if(norm(p.estado)!=='ACTIVO') continue;
              const rol=String(p.rol||p.codigoRol||'').trim();
              const nivel=String(p.nivelAcceso||p.nivel||'').trim();
              const provincia=String(p.provincia||'').trim();
              const canton=String(p.canton||'').trim();
              if(!provincia) continue;
              const provincial=norm(nivel).includes('PROV') || (!canton && !norm(nivel).includes('ZON'));
              if(norm(nivel).includes('ZON')) continue;
              const key=provincial?`PROV|${norm(provincia)}`:`CANT|${norm(provincia)}|${norm(canton)}`;
              if(!map.has(key)) map.set(key,{tipo:provincial?'Provincial':'Cantonal',provincia,canton:provincial?'':canton,totalUsers:0,decisionControl:0,technical:0,other:0});
              const item=map.get(key); item.totalUsers++;
              if(norm(rol)==='TOMADOR DE DECISION/CONTROL') item.decisionControl++;
              else if(norm(rol).includes('TECNICO')) item.technical++;
              else item.other++;
            }
            const institutions=[...map.values()].sort((a,b)=>`${a.provincia}|${a.tipo}|${a.canton}`.localeCompare(`${b.provincia}|${b.tipo}|${b.canton}`,'es'));
            const decisionInstitutions=institutions.filter(x=>x.decisionControl>0);
            const out={product:'SmartRisk CZ5',projectId:process.env.FIREBASE_PROJECT_ID,checkedAt:new Date().toISOString(),activeInstitutions:institutions.length,decisionControlInstitutions:decisionInstitutions.length,decisionInstitutions,allInstitutions:institutions,privacy:'Institution names and aggregate role counts only. No names, emails, UIDs or passwords.'};
            fs.writeFileSync('CREDENTIAL_GADS_BY_ROLE_LATEST.json',JSON.stringify(out,null,2)+'\n');
            console.log(JSON.stringify({activeInstitutions:institutions.length,decisionControlInstitutions:decisionInstitutions.length}));
          })().catch(e=>{console.error('ROLE_GAD_AUDIT_FAILED',e?.code||e?.message||e);process.exit(1)});
          NODE
      - name: Commit sanitized result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SmartRisk Audit Bot"
          git config user.email "actions@users.noreply.github.com"
          git add CREDENTIAL_GADS_BY_ROLE_LATEST.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record credential GAD coverage by role"
          git push origin HEAD:main
