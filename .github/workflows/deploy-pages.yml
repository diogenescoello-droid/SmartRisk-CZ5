name: Deploy SmartRisk CZ5 RC14.4.2

on:
  push:
    branches:
      - main
    paths:
      - "smartrisk-site-rc14.4.2.zip"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Preparar sitio RC14.4.2
        run: |
          rm -rf _site
          mkdir -p _site

          test -f smartrisk-site-rc14.4.2.zip

          unzip -q smartrisk-site-rc14.4.2.zip -d _site

          test -f _site/index.html
          test -f _site/VERSION.txt

          grep -q "RC14.4.2" _site/VERSION.txt

          echo "Versión que se publicará:"
          cat _site/VERSION.txt

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir sitio para Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Publicar SmartRisk
        id: deployment
        uses: actions/deploy-pages@v4
