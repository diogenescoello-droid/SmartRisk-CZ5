name: Deploy SmartRisk CZ5 RC14.4.4 RC7

# Publica RC14.4.4 RC7 con corrección del congelamiento en
# Planes, checklist y brechas.
on:
  push:
    branches:
      - main
    paths:
      - "smartrisk-site-rc14.4.3.zip"
      - "pilot-baseline-data.js"
      - "pilot-baseline-bridge.js"
      - "preview-rc14.4.4/**"
      - "RELEASE_MANIFEST.json"
      - "scripts/**"
      - "firestore.rules"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Preparar Node para validación
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validar coherencia de versión, fuentes y conteos
        run: node scripts/validate-release.mjs

      - name: Validar coherencia del panel científico
        run: node scripts/validate-scientific-quality-fix.mjs

      - name: Validar recepción y estados diferenciados de planes
        run: node scripts/validate-plan-receipt-status.mjs

      - name: Validar sintaxis de las correcciones documentales
        run: |
          node --check preview-rc14.4.4/plan-receipt-status-fix-20260731.js
          node --check preview-rc14.4.4/review-performance-fix-20260731.js

      - name: Preparar base compartida
        run: |
          rm -rf _site
          mkdir -p _site

          test -f smartrisk-site-rc14.4.3.zip
          unzip -q smartrisk-site-rc14.4.3.zip -d _site

          test -f _site/styles.css
          test -f _site/app.js
          test -f _site/firebase-config.js
          test -f _site/vendor/leaflet.css

          test -f pilot-baseline-data.js
          test -f pilot-baseline-bridge.js
          test -f RELEASE_MANIFEST.json
          cp pilot-baseline-data.js pilot-baseline-bridge.js RELEASE_MANIFEST.json _site/

      - name: Promover RC14.4.4 RC7 como versión pública
        run: |
          test -f preview-rc14.4.4/index.html
          test -f preview-rc14.4.4/access-gate-preview.js
          test -f preview-rc14.4.4/access-core.js
          test -f preview-rc14.4.4/access-ui.js
          test -f preview-rc14.4.4/access-form.js
          test -f preview-rc14.4.4/action-r023-core.js
          test -f preview-rc14.4.4/action-r023-page.js
          test -f preview-rc14.4.4/action-r023-form.js
          test -f preview-rc14.4.4/latest-data-update.js
          test -f preview-rc14.4.4/followup-completion-20260730.js
          test -f preview-rc14.4.4/los-rios-plan-correction-20260730.js
          test -f preview-rc14.4.4/scientific-quality-fix-20260731.js
          test -f preview-rc14.4.4/plan-receipt-status-fix-20260731.js
          test -f preview-rc14.4.4/review-performance-fix-20260731.js

          cp -R preview-rc14.4.4/. _site/

          python - <<'PY'
          import json
          from pathlib import Path

          index = Path("_site/index.html")
          html = index.read_text(encoding="utf-8")
          html = html.replace('href="../', 'href="')
          html = html.replace('src="../', 'src="')
          index.write_text(html, encoding="utf-8")

          gate = Path("_site/access-gate-preview.js")
          js = gate.read_text(encoding="utf-8")
          old = 'PRE=`${APP}preview-rc14.4.4/`'
          if old not in js:
              raise SystemExit("No se encontró la ruta previa RC14.4.4")
          js = js.replace(old, 'PRE=APP')
          gate.write_text(js, encoding="utf-8")

          manifest = json.loads(Path("RELEASE_MANIFEST.json").read_text(encoding="utf-8"))
          health = {
              "status": "ok",
              "product": manifest["product"],
              "release": "RC14.4.4 RC7",
              "build": "14.4.4-rc7",
              "dataVersion": manifest["dataVersion"],
              "completionVersion": manifest["completionVersion"],
              "correctionVersion": manifest["correctionVersion"],
              "scientificCorrectionVersion": manifest["scientificCorrectionVersion"],
              "planReceiptCorrectionVersion": manifest["planReceiptCorrectionVersion"],
              "reviewPerformanceVersion": "14.4.4-rc7",
              "reviewObserverStrategy": "idempotent-disconnect-write-reconnect",
              "dataCut": manifest["dataCut"],
              "counts": manifest["counts"]
          }
          Path("_site/HEALTH.json").write_text(json.dumps(health, ensure_ascii=False, indent=2), encoding="utf-8")
          PY

          printf '%s\n' \
            'SmartRisk CZ5 RC14.4.4 RC7' \
            'Seguimiento R02.3 · datos consolidados al 31-07-2026' \
            '56 entidades · 56 planes disponibles · 106 seguimientos territoriales' \
            'Planes, checklist y brechas: ciclo de observación eliminado' \
            'Índice ligero, búsqueda diferida y checklist paginado' \
            'Recepción, archivo, firma, revisión y validación se muestran por separado' \
            > _site/VERSION.txt

          test ! -d _site/preview-rc14.4.4
          test -f _site/pilot-baseline-data.js
          test -f _site/pilot-baseline-bridge.js
          test -f _site/RELEASE_MANIFEST.json
          test -f _site/HEALTH.json
          test -f _site/plan-receipt-status-fix-20260731.js
          test -f _site/review-performance-fix-20260731.js

          grep -q "VERSIÓN ESTABLE · RC14.4.4 RC7 · DATOS 30-07-2026" _site/index.html
          grep -q 'access-gate-preview.js?v=14.4.4-rc7' _site/index.html
          grep -q 'BUILD="14.4.4-rc7"' _site/access-gate-preview.js
          grep -q 'review-performance-fix-20260731.js' _site/access-gate-preview.js
          grep -q 'stable-r023-review-freeze-fixed' _site/access-gate-preview.js
          grep -q 'observerStrategy:"idempotent-disconnect-write-reconnect"' _site/plan-receipt-status-fix-20260731.js
          grep -q 'observer.disconnect()' _site/plan-receipt-status-fix-20260731.js
          grep -q 'note.textContent!==desiredNote' _site/plan-receipt-status-fix-20260731.js
          grep -q 'CHECKLIST_BATCH=25' _site/review-performance-fix-20260731.js
          grep -q 'requestAnimationFrame' _site/review-performance-fix-20260731.js
          grep -q '"reviewObserverStrategy": "idempotent-disconnect-write-reconnect"' _site/HEALTH.json
          grep -q '"status": "ok"' _site/HEALTH.json
          ! grep -q 'href="../' _site/index.html
          ! grep -q 'src="../' _site/index.html

          echo "SmartRisk RC14.4.4 RC7 quedó preparada sin el ciclo recursivo de revisión documental."
          cat _site/VERSION.txt

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir sitio para Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Publicar SmartRisk
        id: deployment
        uses: actions/deploy-pages@v4
