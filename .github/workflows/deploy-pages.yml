name: Deploy SmartRisk CZ5

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar sitio actual
        run: |
          rm -rf _site
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' ./ _site/
          test -f _site/index.html
          test -f _site/informes-contextuales.js
          test -f _site/informes-contextuales.css
          printf '%s\n' \
            'SmartRisk CZ5 · versión ajustada' \
            'Informes técnicos distribuidos en Territorios y Cartografía' \
            'Sin pestaña independiente de informes técnicos' \
            > _site/VERSION.txt

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar SmartRisk
        id: deployment
        uses: actions/deploy-pages@v4
