name: Deploy SmartRisk CZ5 RC14.4.4 estable

# Publica una sola versión en la raíz: RC14.4.4 RC5 con seguimiento R02.3 y datos consolidados.
on:
  push:
    branches:
      - main
    paths:
      - "smartrisk-site-rc14.4.3.zip"
      - "pilot-baseline-data.js"
      - "pilot-baseline-bridge.js"
      - "preview-rc14.4.4/**"
      - "RELEASE_MANIFEST.json"
      - "scripts/validate-release.mjs"
      - "firestore.rules"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Preparar Node para validación
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validar coherencia de versión, fuentes y conteos
        run: node scripts/validate-release.mjs

      - name: Preparar base compartida
        run: |
          rm -rf _site
          mkdir -p _site

          test -f smartrisk-site-rc14.4.3.zip
          unzip -q smartrisk-site-rc14.4.3.zip -d _site

          test -f _site/styles.css
          test -f _site/app.js
          test -f _site/firebase-config.js
          test -f _site/vendor/leaflet.css

          test -f pilot-baseline-data.js
          test -f pilot-baseline-bridge.js
          test -f RELEASE_MANIFEST.json
          cp pilot-baseline-data.js pilot-baseline-bridge.js RELEASE_MANIFEST.json _site/

      - name: Promover RC14.4.4 RC5 como única versión pública
        run: |
          test -f preview-rc14.4.4/index.html
          test -f preview-rc14.4.4/access-gate-preview.js
          test -f preview-rc14.4.4/access-core.js
          test -f preview-rc14.4.4/access-ui.js
          test -f preview-rc14.4.4/access-form.js
          test -f preview-rc14.4.4/action-r023-core.js
          test -f preview-rc14.4.4/action-r023-page.js
          test -f preview-rc14.4.4/action-r023-form.js
          test -f preview-rc14.4.4/latest-data-update.js
          test -f preview-rc14.4.4/followup-completion-20260730.js
          test -f preview-rc14.4.4/los-rios-plan-correction-20260730.js

          cp -R preview-rc14.4.4/. _site/

          python - <<'PY'
          import json
          from pathlib import Path

          index = Path("_site/index.html")
          html = index.read_text(encoding="utf-8")
          html = html.replace('href="../', 'href="')
          html = html.replace('src="../', 'src="')
          index.write_text(html, encoding="utf-8")

          gate = Path("_site/access-gate-preview.js")
          js = gate.read_text(encoding="utf-8")
          old = 'PRE=`${APP}preview-rc14.4.4/`'
          if old not in js:
              raise SystemExit("No se encontró la ruta previa RC14.4.4")
          js = js.replace(old, 'PRE=APP')
          gate.write_text(js, encoding="utf-8")

          manifest = json.loads(Path("RELEASE_MANIFEST.json").read_text(encoding="utf-8"))
          health = {
              "status": "ok",
              "product": manifest["product"],
              "release": manifest["release"],
              "build": manifest["build"],
              "dataVersion": manifest["dataVersion"],
              "completionVersion": manifest["completionVersion"],
              "correctionVersion": manifest["correctionVersion"],
              "dataCut": manifest["dataCut"],
              "counts": manifest["counts"]
          }
          Path("_site/HEALTH.json").write_text(json.dumps(health, ensure_ascii=False, indent=2), encoding="utf-8")
          PY

          printf '%s\n' 'SmartRisk CZ5 RC14.4.4 RC5' 'Seguimiento R02.3 · datos consolidados al 30-07-2026' '56 entidades · 56 planes disponibles · 106 seguimientos territoriales' 'Los Ríos provincial · plan funcional parcial 68 % · en corrección progresiva' > _site/VERSION.txt

          test ! -d _site/preview-rc14.4.4
          test -f _site/pilot-baseline-data.js
          test -f _site/pilot-baseline-bridge.js
          test -f _site/RELEASE_MANIFEST.json
          test -f _site/HEALTH.json
          test -f _site/followup-completion-20260730.js
          test -f _site/los-rios-plan-correction-20260730.js
          grep -q "VERSIÓN ESTABLE · RC14.4.4 · DATOS 30-07-2026" _site/index.html
          grep -q '14.4.4-rc5' _site/index.html
          grep -q 'PRE=APP' _site/access-gate-preview.js
          grep -q 'stable-r023-latest-data' _site/access-gate-preview.js
          grep -q 'latest-data-update.js' _site/access-gate-preview.js
          grep -q 'followup-completion-20260730.js' _site/access-gate-preview.js
          grep -q 'los-rios-plan-correction-20260730.js' _site/access-gate-preview.js
          grep -q 'diogenes.coello@gestionderiesgos.gob.ec' _site/access-gate-preview.js
          grep -q 'DecompressionStream' _site/latest-data-update.js
          grep -q 'SMART_RISK_LATEST_DATA_UPDATE' _site/latest-data-update.js
          grep -q 'SMART_RISK_FOLLOWUP_COMPLETION' _site/followup-completion-20260730.js
          grep -q 'Sincronizado · 106 seguimientos' _site/followup-completion-20260730.js
          grep -q 'SMART_RISK_LOS_RIOS_PLAN_CORRECTION' _site/los-rios-plan-correction-20260730.js
          grep -q 'planReviewScore":68' _site/los-rios-plan-correction-20260730.js
          grep -q 'Sincronizado · 56 planes' _site/los-rios-plan-correction-20260730.js
          grep -q "Calidad operativa y revisión UGR" _site/action-r023-page.js
          grep -q "Compromiso próximo" _site/action-r023-form.js
          grep -q '"plansAvailable": 56' _site/RELEASE_MANIFEST.json
          grep -q '"followupsMinimum": 106' _site/RELEASE_MANIFEST.json
          grep -q '"status": "ok"' _site/HEALTH.json
          grep -q '"correctionVersion"' _site/HEALTH.json
          ! grep -q 'href="../' _site/index.html
          ! grep -q 'src="../' _site/index.html

          echo "SmartRisk RC14.4.4 RC5 quedó preparada como única versión pública con 56 planes disponibles."
          cat _site/VERSION.txt

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir sitio para Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Publicar SmartRisk
        id: deployment
        uses: actions/deploy-pages@v4
