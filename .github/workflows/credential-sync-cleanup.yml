name: Cleanup temporary credential sync channel

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/credential-sync-cleanup.yml"

permissions:
  contents: write
  id-token: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_SMARTRISK_CZ5_PRODUCCION }}"
      - name: Delete temporary private key
        env:
          FIREBASE_PROJECT_ID: smartrisk-cz5-produccion
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/smartrisk-cleanup && cd /tmp/smartrisk-cleanup
          npm init -y >/dev/null 2>&1
          npm install --silent firebase-admin@13
          export NODE_PATH=/tmp/smartrisk-cleanup/node_modules
          cd "$GITHUB_WORKSPACE"
          node <<'NODE'
          const admin=require('firebase-admin');
          admin.initializeApp({credential:admin.credential.applicationDefault(),projectId:process.env.FIREBASE_PROJECT_ID});
          admin.firestore().collection('_system_credential_sync').doc('current').delete().then(()=>console.log('Temporary private key deleted')).catch(e=>{console.error(e.message);process.exit(1)});
          NODE
      - name: Remove temporary repository artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SmartRisk Credential Sync Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm -f --ignore-unmatch CREDENTIAL_SYNC_PUBLIC_KEY.json credential-sync-payload.part00 credential-sync-payload.part01 credential-sync-payload.part02 credential-sync-payload.part03 credential-sync-payload.part04 credential-sync-payload.part05 credential-sync-payload.part06 .github/workflows/credential-sync-keygen.yml .github/workflows/credential-sync-apply.yml .github/workflows/credential-sync-cleanup.yml
          git commit -m "Remove temporary credential synchronization channel"
          git push origin HEAD:main
