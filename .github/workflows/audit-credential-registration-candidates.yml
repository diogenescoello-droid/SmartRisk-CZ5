name: Audit credential registration candidates

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/audit-credential-registration-candidates.yml"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_SMARTRISK_CZ5_PRODUCCION }}"
      - name: Build normalized institutional candidates
        env:
          FIREBASE_PROJECT_ID: smartrisk-cz5-produccion
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/smartrisk-candidate-audit
          cd /tmp/smartrisk-candidate-audit
          npm init -y >/dev/null 2>&1
          npm install --silent firebase-admin@13
          export NODE_PATH=/tmp/smartrisk-candidate-audit/node_modules
          cd "$GITHUB_WORKSPACE"
          node <<'NODE'
          const fs=require('fs');
          const admin=require('firebase-admin');
          admin.initializeApp({credential:admin.credential.applicationDefault(),projectId:process.env.FIREBASE_PROJECT_ID});
          const db=admin.firestore();
          const norm=v=>String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toUpperCase();
          function canonCanton(v){
            const n=norm(v);
            if(n==='STA. LUCIA'||n==='STA LUCIA'||n==='SANTA LUCIA') return 'Santa Lucía';
            if(n==='L. DE SARGENTILLO'||n==='L DE SARGENTILLO'||n==='LOMAS DE SARGENTILLO') return 'Lomas de Sargentillo';
            if(n==='GRAL. A. ELIZALDE BUCAY'||n==='GRAL A. ELIZALDE BUCAY'||n==='GENERAL ANTONIO ELIZALDE'||n==='BUCAY') return 'General Antonio Elizalde (Bucay)';
            if(n==='M. MARIDUENA'||n==='M MARIDUENA'||n==='MARCELINO MARIDUENA') return 'Marcelino Maridueña';
            if(n==='ALFREDO BAQUERIZO'||n==='ALFREDO BAQUERIZO MORENO'||n==='JUJAN') return 'Alfredo Baquerizo Moreno (Jujan)';
            return String(v||'').trim();
          }
          (async()=>{
            const snap=await db.collection('perfiles').get();
            const map=new Map();
            for(const d of snap.docs){
              const p=d.data()||{}; if(norm(p.estado)!=='ACTIVO') continue;
              const nivel=String(p.nivelAcceso||p.nivel||'').trim(); if(norm(nivel).includes('ZON')) continue;
              const provincia=String(p.provincia||'').trim(); if(!provincia) continue;
              const cantonRaw=String(p.canton||'').trim(); const provincial=norm(nivel).includes('PROV')||!cantonRaw;
              const canton=provincial?'':canonCanton(cantonRaw);
              const key=provincial?`PROV|${norm(provincia)}`:`CANT|${norm(provincia)}|${norm(canton)}`;
              if(!map.has(key)) map.set(key,{tipo:provincial?'Provincial':'Cantonal',provincia,canton,totalUsers:0,decisionControl:0});
              const item=map.get(key); item.totalUsers++;
              const rol=norm(p.rol||p.codigoRol||''); if(rol==='TOMADOR DE DECISION/CONTROL') item.decisionControl++;
            }
            const all=[...map.values()].sort((a,b)=>`${a.provincia}|${a.tipo}|${a.canton}`.localeCompare(`${b.provincia}|${b.tipo}|${b.canton}`,'es'));
            const candidates=all.filter(x=>x.totalUsers>=2||x.decisionControl>0);
            const out={product:'SmartRisk CZ5',checkedAt:new Date().toISOString(),candidateInstitutions:candidates.length,candidates,privacy:'Institution names and aggregate counts only.'};
            fs.writeFileSync('CREDENTIAL_REGISTRATION_CANDIDATES_LATEST.json',JSON.stringify(out,null,2)+'\n');
            console.log(JSON.stringify({candidateInstitutions:candidates.length,candidates}));
          })().catch(e=>{console.error('CANDIDATE_AUDIT_FAILED',e?.code||e?.message||e);process.exit(1)});
          NODE
      - name: Commit sanitized candidates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SmartRisk Audit Bot"
          git config user.email "actions@users.noreply.github.com"
          git add CREDENTIAL_REGISTRATION_CANDIDATES_LATEST.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record normalized credential registration candidates"
          git push origin HEAD:main
