name: Verificar secreto OpenAI temporal

on:
  push:
    branches: ["gpt-integration-20260824"]
    paths:
      - ".github/workflows/check-openai-secret-temporary.yml"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar presencia sin revelar valor
        env:
          OPENAI_API_KEY: "${{ secrets.OPENAI_API_KEY }}"
        shell: bash
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            printf 'OPENAI_API_KEY_PRESENT=true\n' > OPENAI_SECRET_STATUS.txt
          else
            printf 'OPENAI_API_KEY_PRESENT=false\n' > OPENAI_SECRET_STATUS.txt
          fi
      - name: Registrar resultado seguro
        shell: bash
        run: |
          git config user.name "SmartRisk GPT Diagnostic"
          git config user.email "actions@users.noreply.github.com"
          git add OPENAI_SECRET_STATUS.txt
          git commit -m "Diagnóstico seguro de credencial OpenAI" || exit 0
          git push
