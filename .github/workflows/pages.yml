name: LEGACY - Publicar web-release manualmente

# Flujo heredado conservado solo para recuperación manual.
# La publicación productiva usa deploy-pages.yml y el paquete versionado.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-legacy-manual
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Desactivar Jekyll
        run: touch web-release/.nojekyll

      - name: Cargar versión heredada
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web-release

      - name: Publicar versión heredada
        id: deployment
        uses: actions/deploy-pages@v4
