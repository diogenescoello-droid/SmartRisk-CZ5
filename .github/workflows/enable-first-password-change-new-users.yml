name: Enable first password change for imported users

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/enable-first-password-change-new-users.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  enable_first_change:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate Firebase production
        uses: google-github-actions/auth@v2
        with:
          credentials_json: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_SMARTRISK_CZ5_PRODUCCION }}"

      - name: Prepare Firebase Admin
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/smartrisk-first-change
          cd /tmp/smartrisk-first-change
          npm init -y >/dev/null 2>&1
          npm install --silent firebase-admin@13

      - name: Enable first password change for exact imported batch
        env:
          FIREBASE_PROJECT_ID: smartrisk-cz5-produccion
        shell: bash
        run: |
          set -euo pipefail
          export NODE_PATH=/tmp/smartrisk-first-change/node_modules
          node <<'NODE'
          const admin = require('firebase-admin');

          admin.initializeApp({
            credential: admin.credential.applicationDefault(),
            projectId: process.env.FIREBASE_PROJECT_ID
          });

          const auth = admin.auth();
          const db = admin.firestore();
          const norm = v => String(v || '').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase();

          async function listUsers() {
            const all = [];
            let pageToken;
            do {
              const page = await auth.listUsers(1000, pageToken);
              all.push(...page.users);
              pageToken = page.pageToken;
            } while (pageToken);
            return all;
          }

          (async () => {
            const [users, snap] = await Promise.all([listUsers(), db.collection('perfiles').get()]);
            const authByUid = new Map(users.map(u => [u.uid, u]));

            const candidates = snap.docs.filter(doc => {
              const p = doc.data();
              const u = authByUid.get(doc.id);
              return doc.id.startsWith('sr_') &&
                !!u && !u.disabled &&
                norm(p.estado) === 'activo' &&
                norm(p.metodoActivacion) === 'credencial inicial administrada';
            });

            if (candidates.length !== 44) {
              throw new Error(`SAFE_ABORT_EXPECTED_44_FOUND_${candidates.length}`);
            }

            for (const doc of candidates) {
              const u = authByUid.get(doc.id);
              const p = doc.data();
              const authEmail = norm(u.email);
              const profileEmail = norm(p.correo || p.email);
              if (!authEmail || authEmail !== profileEmail) {
                throw new Error('SAFE_ABORT_EMAIL_UID_MISMATCH');
              }
              const providers = (u.providerData || []).map(x => x.providerId);
              if (!providers.includes('password')) {
                throw new Error('SAFE_ABORT_PASSWORD_PROVIDER_MISSING');
              }
            }

            let updated = 0;
            for (const doc of candidates) {
              await doc.ref.set({
                requiereCambioClave: true,
                cambioClaveSolicitadoEn: admin.firestore.FieldValue.serverTimestamp()
              }, { merge: true });
              updated += 1;
            }

            let verified = 0;
            for (const doc of candidates) {
              const fresh = await doc.ref.get();
              if (fresh.exists && fresh.data().requiereCambioClave === true) verified += 1;
            }

            if (updated !== 44 || verified !== 44) {
              throw new Error(`VERIFY_FAILED_UPDATED_${updated}_VERIFIED_${verified}`);
            }

            console.log(JSON.stringify({ candidates: candidates.length, updated, verified }));
          })().catch(error => {
            console.error(error.message || error.code || 'FIRST_CHANGE_ENABLE_FAILED');
            process.exit(1);
          });
          NODE
