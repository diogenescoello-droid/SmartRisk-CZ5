name: Normalize imported credential activation policy

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/enable-first-password-change-new-users.yml"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  normalize_activation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Authenticate Firebase production
        uses: google-github-actions/auth@v2
        with:
          credentials_json: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_SMARTRISK_CZ5_PRODUCCION }}"

      - name: Prepare Firebase Admin
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/smartrisk-activation-normalize
          cd /tmp/smartrisk-activation-normalize
          npm init -y >/dev/null 2>&1
          npm install --silent firebase-admin@13

      - name: Normalize exact imported batch
        env:
          FIREBASE_PROJECT_ID: smartrisk-cz5-produccion
        shell: bash
        run: |
          set -euo pipefail
          export NODE_PATH=/tmp/smartrisk-activation-normalize/node_modules
          node <<'NODE'
          const admin = require('firebase-admin');
          const fs = require('fs');

          admin.initializeApp({
            credential: admin.credential.applicationDefault(),
            projectId: process.env.FIREBASE_PROJECT_ID
          });

          const auth = admin.auth();
          const db = admin.firestore();
          const norm = v => String(v || '').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase();

          async function listUsers() {
            const all = [];
            let pageToken;
            do {
              const page = await auth.listUsers(1000, pageToken);
              all.push(...page.users);
              pageToken = page.pageToken;
            } while (pageToken);
            return all;
          }

          (async () => {
            const [users, snap] = await Promise.all([listUsers(), db.collection('perfiles').get()]);
            const authByUid = new Map(users.map(u => [u.uid, u]));

            const candidates = snap.docs.filter(doc => {
              const p = doc.data();
              const u = authByUid.get(doc.id);
              return doc.id.startsWith('sr_') &&
                !!u && !u.disabled &&
                norm(p.estado) === 'activo' &&
                norm(p.metodoActivacion) === 'credencial inicial administrada';
            });

            if (candidates.length !== 44) {
              throw new Error(`SAFE_ABORT_EXPECTED_44_FOUND_${candidates.length}`);
            }

            for (const doc of candidates) {
              const u = authByUid.get(doc.id);
              const p = doc.data();
              const authEmail = norm(u.email);
              const profileEmail = norm(p.correo || p.email);
              if (!authEmail || authEmail !== profileEmail) {
                throw new Error('SAFE_ABORT_EMAIL_UID_MISMATCH');
              }
              const providers = (u.providerData || []).map(x => x.providerId);
              if (!providers.includes('password')) {
                throw new Error('SAFE_ABORT_PASSWORD_PROVIDER_MISSING');
              }
            }

            let updated = 0;
            for (const doc of candidates) {
              await doc.ref.set({
                requiereCambioClave: false,
                metodoActivacion: 'Credencial inicial administrada',
                cambioClaveSolicitadoEn: admin.firestore.FieldValue.delete(),
                actualizadoEn: admin.firestore.FieldValue.serverTimestamp(),
                actualizadoPor: 'automation:normalize-imported-credentials'
              }, { merge: true });
              updated += 1;
            }

            let verified = 0;
            let stillForced = 0;
            for (const doc of candidates) {
              const fresh = await doc.ref.get();
              const p = fresh.data() || {};
              if (fresh.exists && p.requiereCambioClave === false && norm(p.metodoActivacion) === 'credencial inicial administrada') verified += 1;
              if (p.requiereCambioClave === true) stillForced += 1;
            }

            if (updated !== 44 || verified !== 44 || stillForced !== 0) {
              throw new Error(`VERIFY_FAILED_UPDATED_${updated}_VERIFIED_${verified}_STILL_FORCED_${stillForced}`);
            }

            const report = {
              projectId: process.env.FIREBASE_PROJECT_ID,
              checkedAt: new Date().toISOString(),
              candidates: candidates.length,
              updated,
              verified,
              stillForced,
              policy: 'Correo + clave inicial; sin cambio obligatorio al primer ingreso',
              containsPersonalData: false
            };
            fs.writeFileSync('ACTIVATION_REPAIR_LATEST.json', JSON.stringify(report, null, 2) + '\n');
            console.log(JSON.stringify(report));
          })().catch(error => {
            console.error(error.message || error.code || 'ACTIVATION_NORMALIZE_FAILED');
            process.exit(1);
          });
          NODE

      - name: Commit sanitized repair evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SmartRisk Access Bot"
          git config user.email "actions@users.noreply.github.com"
          git add ACTIVATION_REPAIR_LATEST.json
          git commit -m "Record credential activation repair" || exit 0
          git push origin HEAD:main
