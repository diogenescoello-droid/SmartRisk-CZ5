name: Diagnosticar Firebase Rules REST temporal

on:
  push:
    branches: ["fix-f07-firestore-20260824"]
    paths:
      - ".github/workflows/diagnose-firestore-rules-rest.yml"
      - "firestore.rules"

permissions:
  contents: write

jobs:
  rules_rest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar credencial Google
        uses: google-github-actions/auth@v2
        with:
          credentials_json: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_SMARTRISK_CZ5_PRODUCCION }}"
      - name: Publicar las reglas actuales por Firebase Rules REST
        env:
          PROJECT_ID: smartrisk-cz5-produccion
        run: |
          set -euo pipefail
          ACCESS_TOKEN="$(gcloud auth application-default print-access-token)"
          RULESET_BODY="$(jq -n --rawfile rules firestore.rules '{source:{files:[{name:"firestore.rules",content:$rules}]}}')"
          RULESET_RESPONSE="$(curl -fsS -X POST \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$RULESET_BODY" \
            "https://firebaserules.googleapis.com/v1/projects/$PROJECT_ID/rulesets")"
          RULESET_NAME="$(printf '%s' "$RULESET_RESPONSE" | jq -r '.name // empty')"
          test -n "$RULESET_NAME"
          RELEASE_NAME="projects/$PROJECT_ID/releases/cloud.firestore"
          RELEASE_BODY="$(jq -n --arg release "$RELEASE_NAME" --arg ruleset "$RULESET_NAME" '{release:{name:$release,rulesetName:$ruleset},updateMask:"rulesetName"}')"
          RELEASE_RESPONSE="$(curl -fsS -X PATCH \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$RELEASE_BODY" \
            "https://firebaserules.googleapis.com/v1/$RELEASE_NAME")"
          test "$(printf '%s' "$RELEASE_RESPONSE" | jq -r '.rulesetName // empty')" = "$RULESET_NAME"
          printf 'RULES_REST_OK\nrelease=%s\nruleset=%s\nchecked_at=%s\n' "$RELEASE_NAME" "$RULESET_NAME" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > RULES_REST_DIAGNOSTIC.txt
      - name: Registrar evidencia del diagnóstico
        run: |
          git config user.name "SmartRisk Rules Diagnostic"
          git config user.email "actions@users.noreply.github.com"
          git add RULES_REST_DIAGNOSTIC.txt
          git commit -m "Registrar diagnóstico exitoso de Firebase Rules REST"
          git push
