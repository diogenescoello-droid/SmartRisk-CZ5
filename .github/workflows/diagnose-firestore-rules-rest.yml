name: Diagnosticar Firebase Rules REST temporal

on:
  push:
    branches: ["fix-f07-firestore-20260824"]
    paths:
      - ".github/workflows/diagnose-firestore-rules-rest.yml"
      - "firestore.rules"

permissions:
  contents: read

jobs:
  rules_rest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_SMARTRISK_CZ5_PRODUCCION }}"
          token_format: access_token
      - name: Publicar las reglas actuales por Firebase Rules REST
        env:
          ACCESS_TOKEN: "${{ steps.auth.outputs.access_token }}"
          PROJECT_ID: smartrisk-cz5-produccion
        run: |
          node <<'NODE'
          const fs = require('fs');
          const project = process.env.PROJECT_ID;
          const token = process.env.ACCESS_TOKEN;
          const base = 'https://firebaserules.googleapis.com/v1';
          const headers = { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' };
          async function call(method, url, body) {
            const response = await fetch(url, { method, headers, body: body ? JSON.stringify(body) : undefined });
            const text = await response.text();
            let payload = {};
            try { payload = text ? JSON.parse(text) : {}; } catch { payload = { raw: text }; }
            if (!response.ok) throw new Error(`${method} ${url} -> ${response.status}: ${JSON.stringify(payload)}`);
            return payload;
          }
          const rules = fs.readFileSync('firestore.rules', 'utf8');
          const ruleset = await call('POST', `${base}/projects/${project}/rulesets`, {
            source: { files: [{ name: 'firestore.rules', content: rules }] }
          });
          if (!ruleset.name) throw new Error('Firebase Rules API no devolvió nombre de ruleset.');
          const releaseName = `projects/${project}/releases/cloud.firestore`;
          const release = await call('PATCH', `${base}/${releaseName}`, {
            release: { name: releaseName, rulesetName: ruleset.name },
            updateMask: 'rulesetName'
          });
          if (release.rulesetName !== ruleset.name) throw new Error('La release no quedó vinculada al ruleset creado.');
          console.log(`RULES_REST_OK ${release.name} -> ${release.rulesetName}`);
          NODE
