name: Deploy SmartRisk CZ5 to Firebase Hosting

on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "access-gate.js"
      - "release-config.js"
      - "RELEASE_MANIFEST.json"
      - "release-assets.json"
      - "firebase.json"
      - "enos-*.js"
      - "f07-current-data.js"
      - "data.js"
      - "app.js"
      - "scripts/**"
      - "tests/**"
      - "preview-rc14.4.4/**"
      - ".github/workflows/deploy-firebase.yml"
  workflow_dispatch:

permissions:
  contents: write
  checks: write

concurrency:
  group: firebase-hosting-production
  cancel-in-progress: true

jobs:
  build_test_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - id: validate
        name: Construir y validar artefacto canónico
        shell: bash
        run: |
          set -o pipefail
          node scripts/test-release.mjs 2>&1 | tee DEPLOYMENT_VALIDATION.log

      - id: deploy
        name: Publicar canal live de Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_SMARTRISK_CZ5_PRODUCCION }}"
          channelId: live
          projectId: smartrisk-cz5-produccion

      - name: Registrar resultado verificable del despliegue
        if: always()
        env:
          VALIDATE_OUTCOME: "${{ steps.validate.outcome }}"
          DEPLOY_OUTCOME: "${{ steps.deploy.outcome }}"
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const validate = process.env.VALIDATE_OUTCOME || 'unknown';
          const deploy = process.env.DEPLOY_OUTCOME || 'unknown';
          fs.writeFileSync('DEPLOYMENT_STATUS.json', JSON.stringify({
            product: 'SmartRisk CZ5',
            projectId: 'smartrisk-cz5-produccion',
            channel: 'live',
            url: 'https://smartrisk-cz5-produccion.web.app/',
            sourceCommit: process.env.GITHUB_SHA,
            checkedAt: new Date().toISOString(),
            validation: validate,
            deployment: deploy,
            status: validate === 'success' && deploy === 'success' ? 'deployed' : 'failed'
          }, null, 2) + '\n');
          NODE
          git config user.name "SmartRisk Deploy Bot"
          git config user.email "actions@users.noreply.github.com"
          git add DEPLOYMENT_STATUS.json DEPLOYMENT_VALIDATION.log
          git commit -m "Record Firebase deployment outcome" || exit 0
          git push
