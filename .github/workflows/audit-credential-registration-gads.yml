name: Audit credential registration GAD coverage

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/audit-credential-registration-gads.yml"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  audit_registration_gads:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_SMARTRISK_CZ5_PRODUCCION }}"
      - name: Read sanitized institutional registration coverage
        env:
          FIREBASE_PROJECT_ID: smartrisk-cz5-produccion
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/smartrisk-reg-audit
          cd /tmp/smartrisk-reg-audit
          npm init -y >/dev/null 2>&1
          npm install --silent firebase-admin@13
          export NODE_PATH=/tmp/smartrisk-reg-audit/node_modules
          cd "$GITHUB_WORKSPACE"
          node <<'NODE'
          const fs=require('fs');
          const admin=require('firebase-admin');
          admin.initializeApp({credential:admin.credential.applicationDefault(),projectId:process.env.FIREBASE_PROJECT_ID});
          const db=admin.firestore();
          const norm=v=>String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toUpperCase();
          (async()=>{
            const snap=await db.collection('perfiles').get();
            const rows=[];
            for(const d of snap.docs){
              const p=d.data()||{};
              if(String(p.actualizadoPor||'')!=='credential-sync-admin-sdk') continue;
              const nivel=String(p.nivelAcceso||p.nivel||'').trim();
              const provincia=String(p.provincia||'').trim();
              const canton=String(p.canton||'').trim();
              rows.push({nivel,provincia,canton});
            }
            const byKey=new Map();
            for(const r of rows){
              const provincial=norm(r.nivel).includes('PROV');
              const key=provincial?`PROV|${norm(r.provincia)}`:`CANT|${norm(r.provincia)}|${norm(r.canton)}`;
              if(!byKey.has(key)) byKey.set(key,{tipo:provincial?'Provincial':'Cantonal',provincia:r.provincia,canton:provincial?'':r.canton,userCount:0});
              byKey.get(key).userCount++;
            }
            const institutions=[...byKey.values()].sort((a,b)=>`${a.provincia}|${a.tipo}|${a.canton}`.localeCompare(`${b.provincia}|${b.tipo}|${b.canton}`,'es'));
            const report={product:'SmartRisk CZ5',projectId:process.env.FIREBASE_PROJECT_ID,checkedAt:new Date().toISOString(),source:'perfiles where actualizadoPor=credential-sync-admin-sdk',registeredProfiles:rows.length,registeredInstitutions:institutions.length,institutions,privacy:'Institutional geography/counts only. No names, emails, UIDs or passwords.'};
            fs.writeFileSync('CREDENTIAL_REGISTRATION_GADS_LATEST.json',JSON.stringify(report,null,2)+'\n');
            console.log(JSON.stringify({registeredProfiles:rows.length,registeredInstitutions:institutions.length,institutions}));
          })().catch(e=>{console.error('REGISTRATION_GAD_AUDIT_FAILED',e?.code||e?.message||e);process.exit(1)});
          NODE
      - name: Commit sanitized institutional coverage
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SmartRisk Audit Bot"
          git config user.email "actions@users.noreply.github.com"
          git add CREDENTIAL_REGISTRATION_GADS_LATEST.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record credential registration GAD coverage"
          git push origin HEAD:main
