name: Sincronizar F07 Kobo

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  checks: write

concurrency:
  group: sync-f07-public
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Leer, normalizar y sincronizar corte F07 con metadatos
        run: node scripts/sync-f07-public.mjs

      - name: Verificar plataforma
        run: node scripts/test-release.mjs

      - id: changes
        name: Detectar nuevo corte F07 o ajuste de metadatos
        shell: bash
        run: |
          if git diff --quiet -- f07-current-data.js RELEASE_MANIFEST.json release-config.js; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "F07 y metadatos sin cambios"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Nuevo corte F07 o ajuste de metadatos detectado"
          fi

      - id: deploy
        if: steps.changes.outputs.changed == 'true'
        name: Publicar corte F07 coherente en Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_SMARTRISK_CZ5_PRODUCCION }}"
          channelId: live
          projectId: smartrisk-cz5-produccion

      - name: Verificar datos y metadatos visibles en producción
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for asset in f07-current-data.js release-config.js RELEASE_MANIFEST.json; do
            test -f "dist/$asset"
            LIVE_FILE="$RUNNER_TEMP/${asset//\//_}.live"
            verified=false
            for attempt in 1 2 3 4 5; do
              if curl -fsSL -H 'Cache-Control: no-cache' \
                "https://smartrisk-cz5-produccion.web.app/${asset}?run=${GITHUB_RUN_ID}&attempt=${attempt}" \
                -o "$LIVE_FILE" && cmp -s "dist/$asset" "$LIVE_FILE"; then
                verified=true
                break
              fi
              sleep 3
            done
            if [ "$verified" != "true" ]; then
              echo "::error::$asset desplegado no coincide con el artefacto canónico visible en producción."
              exit 1
            fi
            echo "LIVE_OK $asset"
          done

      - name: Registrar cambio verificable después de publicar
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "SmartRisk F07 Bot"
          git config user.email "actions@users.noreply.github.com"
          git add f07-current-data.js RELEASE_MANIFEST.json release-config.js
          git commit -m "Actualizar seguimiento F07 y metadatos de corte desde Kobo"
          git push
