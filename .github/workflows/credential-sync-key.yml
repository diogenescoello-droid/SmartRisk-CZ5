name: Prepare one-time SmartRisk credential synchronization key
# Refresh requested 2026-09-01 16:45 -05:00

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/credential-sync-key.yml"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  prepare_key:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_SMARTRISK_CZ5_PRODUCCION }}"
      - name: Generate one-time RSA key and publish public half
        env:
          FIREBASE_PROJECT_ID: smartrisk-cz5-produccion
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/smartrisk-key && cd /tmp/smartrisk-key
          npm init -y >/dev/null 2>&1
          npm install --silent firebase-admin@13
          export NODE_PATH=/tmp/smartrisk-key/node_modules
          cd "$GITHUB_WORKSPACE"
          node <<'NODE'
          const fs=require('fs');
          const crypto=require('crypto');
          const admin=require('firebase-admin');
          admin.initializeApp({credential:admin.credential.applicationDefault(),projectId:process.env.FIREBASE_PROJECT_ID});
          const db=admin.firestore();
          (async()=>{
            const {publicKey,privateKey}=crypto.generateKeyPairSync('rsa',{
              modulusLength:3072,
              publicKeyEncoding:{type:'spki',format:'pem'},
              privateKeyEncoding:{type:'pkcs8',format:'pem'}
            });
            const keyId=crypto.randomUUID();
            const createdAt=new Date();
            const expiresAt=new Date(createdAt.getTime()+2*60*60*1000);
            await db.collection('_system_credential_sync').doc('current').set({
              keyId,privateKey,algorithm:'RSA-OAEP-3072-SHA256',createdAt:admin.firestore.FieldValue.serverTimestamp(),expiresAt:admin.firestore.Timestamp.fromDate(expiresAt),active:true
            });
            const publicDoc={keyId,algorithm:'RSA-OAEP-3072-SHA256 + AES-256-GCM',publicKey,createdAt:createdAt.toISOString(),expiresAt:expiresAt.toISOString(),active:true};
            fs.writeFileSync('CREDENTIAL_SYNC_PUBLIC_KEY.json',JSON.stringify(publicDoc,null,2)+'\n');
            console.log(JSON.stringify({status:'ready',keyId,expiresAt:expiresAt.toISOString()}));
          })().catch(e=>{console.error(e?.message||e);process.exit(1)});
          NODE
      - name: Commit public key metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SmartRisk Credential Sync Bot"
          git config user.email "actions@users.noreply.github.com"
          git add CREDENTIAL_SYNC_PUBLIC_KEY.json
          git commit -m "Publish one-time credential sync public key"
          git push origin HEAD:main
