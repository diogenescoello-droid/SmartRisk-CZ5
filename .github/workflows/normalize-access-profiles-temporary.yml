name: Normalize SmartRisk access profiles temporary

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  normalize_access:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'access-hardening-20260824'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Firebase Admin SDK
        run: npm install --no-save firebase-admin@13.4.0

      - name: Preflight without writes
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_SMARTRISK_CZ5_PRODUCCION }}"
        run: node scripts/normalize-access-profiles.mjs

      - name: Normalize active profiles
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_SMARTRISK_CZ5_PRODUCCION }}"
        run: node scripts/normalize-access-profiles.mjs --apply

      - name: Upload sanitized normalization report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smartrisk-access-normalization-live
          path: ACCESS_NORMALIZATION_REPORT.json
          retention-days: 3
          if-no-files-found: warn
