name: Prepare secure credential sync key

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/credential-sync-keygen.yml"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  prepare_key:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Authenticate to Firebase production
        uses: google-github-actions/auth@v2
        with:
          credentials_json: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_SMARTRISK_CZ5_PRODUCCION }}"

      - name: Prepare Firebase Admin runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/smartrisk-credential-sync
          cd /tmp/smartrisk-credential-sync
          npm init -y >/dev/null 2>&1
          npm install --silent firebase-admin@13

      - name: Generate one-time RSA keypair
        env:
          FIREBASE_PROJECT_ID: smartrisk-cz5-produccion
        shell: bash
        run: |
          set -euo pipefail
          export NODE_PATH=/tmp/smartrisk-credential-sync/node_modules
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const admin = require('firebase-admin');

          admin.initializeApp({
            credential: admin.credential.applicationDefault(),
            projectId: process.env.FIREBASE_PROJECT_ID
          });

          (async () => {
            const { publicKey, privateKey } = crypto.generateKeyPairSync('rsa', {
              modulusLength: 3072,
              publicKeyEncoding: { type: 'spki', format: 'pem' },
              privateKeyEncoding: { type: 'pkcs8', format: 'pem' }
            });
            const keyId = crypto.randomUUID();
            const now = new Date().toISOString();
            const db = admin.firestore();
            await db.collection('_system_credential_sync').doc('current').set({
              keyId,
              privateKey,
              createdAt: now,
              purpose: 'SmartRisk CZ5 one-time 46 credential synchronization'
            });
            fs.writeFileSync('CREDENTIAL_SYNC_PUBLIC_KEY.json', JSON.stringify({
              keyId,
              algorithm: 'RSA-OAEP-3072-SHA256 + AES-256-GCM',
              publicKey,
              createdAt: now
            }, null, 2) + '\n');
            console.log(JSON.stringify({prepared:true,keyId,privateKeyStored:'Firestore locked system path'}));
          })().catch(err => {
            console.error('KEYGEN_FAILED', err && err.code ? err.code : err.message);
            process.exit(1);
          });
          NODE

      - name: Publish public encryption key only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SmartRisk Credential Sync Bot"
          git config user.email "actions@users.noreply.github.com"
          git add CREDENTIAL_SYNC_PUBLIC_KEY.json
          git commit -m "Publish one-time public key for secure credential sync"
          git push origin HEAD:main
