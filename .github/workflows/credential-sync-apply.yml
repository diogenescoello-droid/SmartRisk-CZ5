name: Apply secure 46 credential synchronization

on:
  push:
    branches: ["main"]
    paths:
      - "credential-sync-payload.enc.json"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  sync_credentials:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Authenticate to Firebase production
        uses: google-github-actions/auth@v2
        with:
          credentials_json: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_SMARTRISK_CZ5_PRODUCCION }}"

      - name: Prepare Firebase Admin runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/smartrisk-credential-sync
          cd /tmp/smartrisk-credential-sync
          npm init -y >/dev/null 2>&1
          npm install --silent firebase-admin@13

      - name: Decrypt, synchronize and verify all 46
        env:
          FIREBASE_PROJECT_ID: smartrisk-cz5-produccion
        shell: bash
        run: |
          set -euo pipefail
          export NODE_PATH=/tmp/smartrisk-credential-sync/node_modules
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const admin = require('firebase-admin');

          admin.initializeApp({
            credential: admin.credential.applicationDefault(),
            projectId: process.env.FIREBASE_PROJECT_ID
          });

          const norm = v => String(v || '').trim().toLowerCase();
          const hash = v => crypto.createHash('sha256').update(norm(v)).digest('hex').slice(0,16);
          const db = admin.firestore();
          const auth = admin.auth();

          async function decryptPayload() {
            const envelope = JSON.parse(fs.readFileSync('credential-sync-payload.enc.json', 'utf8'));
            const keyDoc = await db.collection('_system_credential_sync').doc('current').get();
            if (!keyDoc.exists) throw new Error('ONE_TIME_PRIVATE_KEY_NOT_FOUND');
            const keyData = keyDoc.data();
            if (keyData.keyId !== envelope.keyId) throw new Error('KEY_ID_MISMATCH');

            const aesKey = crypto.privateDecrypt({
              key: keyData.privateKey,
              padding: crypto.constants.RSA_PKCS1_OAEP_PADDING,
              oaepHash: 'sha256'
            }, Buffer.from(envelope.encryptedKey, 'base64'));

            const decipher = crypto.createDecipheriv('aes-256-gcm', aesKey, Buffer.from(envelope.iv, 'base64'));
            decipher.setAuthTag(Buffer.from(envelope.tag, 'base64'));
            const clear = Buffer.concat([
              decipher.update(Buffer.from(envelope.ciphertext, 'base64')),
              decipher.final()
            ]);
            return { data: JSON.parse(clear.toString('utf8')), keyRef: keyDoc.ref, keyId: envelope.keyId };
          }

          async function legacyProfiles(email) {
            const found = new Map();
            for (const field of ['correo','email']) {
              const snap = await db.collection('perfiles').where(field, '==', email).limit(20).get();
              snap.docs.forEach(doc => found.set(doc.id, doc));
            }
            return [...found.values()];
          }

          function profilePayload(u) {
            const consulta = ['Visor provincial AME','Visor zonal AME','Consulta provincial AME'].includes(String(u.rol || '').trim());
            return {
              correo: norm(u.correo),
              email: norm(u.correo),
              nombre: String(u.nombre || '').trim(),
              rol: String(u.rol || '').trim(),
              codigoRol: String(u.rol || '').trim(),
              provincia: String(u.provincia || '').trim(),
              canton: String(u.canton || '').trim(),
              nivelAcceso: String(u.nivelAcceso || '').trim(),
              scopeKeys: Array.isArray(u.scopeKeys) ? [...new Set(u.scopeKeys.map(String))] : [],
              estado: 'Activo',
              modoAcceso: consulta ? 'Consulta' : 'Operación',
              invitacionEstado: 'PilotoActivo',
              requiereCambioClave: false,
              metodoActivacion: 'Credencial inicial administrada',
              actualizadoEn: admin.firestore.FieldValue.serverTimestamp(),
              actualizadoPor: 'credential-sync-admin-sdk'
            };
          }

          (async () => {
            const { data, keyRef, keyId } = await decryptPayload();
            const users = Array.isArray(data) ? data : data.users;
            if (!Array.isArray(users)) throw new Error('INVALID_USERS_ARRAY');
            if (users.length !== 46) throw new Error(`EXPECTED_46_GOT_${users.length}`);
            const emails = users.map(u => norm(u.correo));
            if (new Set(emails).size !== 46) throw new Error('DUPLICATE_EMAILS_IN_BATCH');
            for (const u of users) {
              if (!norm(u.correo) || !String(u.claveInicial || '').trim()) throw new Error('MISSING_EMAIL_OR_PASSWORD');
              if (String(u.claveInicial).length < 12) throw new Error('PASSWORD_TOO_SHORT');
            }

            let created = 0;
            let updated = 0;
            let profilesWritten = 0;
            let legacyRemoved = 0;
            const failures = [];
            const targetHashes = [];

            for (const u of users) {
              const email = norm(u.correo);
              const password = String(u.claveInicial).trim();
              try {
                let account;
                try {
                  account = await auth.getUserByEmail(email);
                  account = await auth.updateUser(account.uid, {
                    password,
                    displayName: String(u.nombre || '').trim(),
                    disabled: false
                  });
                  updated++;
                } catch (err) {
                  if (err && err.code === 'auth/user-not-found') {
                    account = await auth.createUser({
                      email,
                      password,
                      displayName: String(u.nombre || '').trim(),
                      disabled: false
                    });
                    created++;
                  } else {
                    throw err;
                  }
                }

                const legacy = await legacyProfiles(email);
                await db.collection('perfiles').doc(account.uid).set(profilePayload(u), { merge: true });
                profilesWritten++;
                for (const doc of legacy) {
                  if (doc.id !== account.uid) {
                    await doc.ref.delete();
                    legacyRemoved++;
                  }
                }

                const checkAuth = await auth.getUserByEmail(email);
                const checkProfile = await db.collection('perfiles').doc(checkAuth.uid).get();
                if (!checkProfile.exists) throw new Error('PROFILE_NOT_FOUND_AFTER_WRITE');
                const p = checkProfile.data();
                if (norm(p.correo || p.email) !== email) throw new Error('PROFILE_EMAIL_MISMATCH');
                if (String(p.rol || '') !== String(u.rol || '')) throw new Error('PROFILE_ROLE_MISMATCH');
                if (p.requiereCambioClave !== false) throw new Error('FORCED_PASSWORD_CHANGE_STILL_ENABLED');
                const expectedScopes = Array.isArray(u.scopeKeys) ? [...new Set(u.scopeKeys.map(String))].sort() : [];
                const actualScopes = Array.isArray(p.scopeKeys) ? [...new Set(p.scopeKeys.map(String))].sort() : [];
                if (JSON.stringify(expectedScopes) !== JSON.stringify(actualScopes)) throw new Error('PROFILE_SCOPE_MISMATCH');
                targetHashes.push(hash(email));
              } catch (err) {
                failures.push({ emailHash: hash(email), code: err && err.code ? err.code : String(err && err.message || err) });
              }
            }

            const result = {
              product: 'SmartRisk CZ5',
              projectId: process.env.FIREBASE_PROJECT_ID,
              checkedAt: new Date().toISOString(),
              targetCount: 46,
              created,
              passwordsReplacedForExisting: updated,
              profilesWritten,
              legacyProfilesRemoved: legacyRemoved,
              verified: targetHashes.length,
              failures,
              targetEmailHashes: targetHashes.sort(),
              policy: {
                login: 'email + administrator-prepared password',
                activationEmailRequired: false,
                forcedFirstPasswordChange: false
              },
              privacy: 'No plaintext emails, names, UIDs or passwords are stored in this report.'
            };

            fs.writeFileSync('CREDENTIAL_SYNC_RESULT.json', JSON.stringify(result, null, 2) + '\n');
            if (failures.length || targetHashes.length !== 46) {
              throw new Error(`SYNC_INCOMPLETE verified=${targetHashes.length} failures=${failures.length}`);
            }

            await keyRef.delete();
            console.log(JSON.stringify({status:'success',created,updated,verified:targetHashes.length,oneTimePrivateKeyDeleted:true,keyId}));
          })().catch(err => {
            console.error('CREDENTIAL_SYNC_FAILED', err && err.code ? err.code : err.message);
            process.exit(1);
          });
          NODE

      - name: Commit sanitized synchronization result
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SmartRisk Credential Sync Bot"
          git config user.email "actions@users.noreply.github.com"
          git add CREDENTIAL_SYNC_RESULT.json
          git commit -m "Record successful 46 credential synchronization"
          git push origin HEAD:main

      - name: Upload sanitized result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: credential-sync-result-${{ github.run_id }}
          path: CREDENTIAL_SYNC_RESULT.json
          retention-days: 2
          if-no-files-found: warn
