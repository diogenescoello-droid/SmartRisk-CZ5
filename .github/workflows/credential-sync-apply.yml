name: Apply pending SmartRisk credential synchronization
# Manual trigger 2026-09-01 after administrator encrypted upload

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/credential-sync-apply.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  apply_pending_sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_SMARTRISK_CZ5_PRODUCCION }}"
      - name: Synchronize pending 46-user credential batch
        env:
          FIREBASE_PROJECT_ID: smartrisk-cz5-produccion
          FIREBASE_WEB_API_KEY: AIzaSyCAgRRrJMKe0RBhVJxjeblkark8jnMhbIY
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/smartrisk-credential-sync && cd /tmp/smartrisk-credential-sync
          npm init -y >/dev/null 2>&1
          npm install --silent firebase-admin@13
          export NODE_PATH=/tmp/smartrisk-credential-sync/node_modules
          cd "$GITHUB_WORKSPACE"
          node <<'NODE'
          const fs=require('fs');
          const crypto=require('crypto');
          const admin=require('firebase-admin');
          admin.initializeApp({credential:admin.credential.applicationDefault(),projectId:process.env.FIREBASE_PROJECT_ID});
          const db=admin.firestore();
          const auth=admin.auth();
          const norm=v=>String(v||'').trim().toLowerCase();
          const hash=v=>crypto.createHash('sha256').update(norm(v)).digest('hex').slice(0,16);
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const supportedRoles=new Set(['Administrador','Técnico zonal','Técnico provincial','Técnico territorial','Coordinador COE','Líder MTT/GT','Tomador de decisión/control','Visor provincial AME','Visor zonal AME','Consulta provincial AME']);

          async function decryptJob(job){
            const keyDoc=await db.collection('_system_credential_sync').doc('current').get();
            if(!keyDoc.exists) throw new Error('ONE_TIME_PRIVATE_KEY_NOT_FOUND');
            const keyData=keyDoc.data()||{};
            if(!job.keyId||job.keyId!==keyData.keyId) throw new Error('KEY_ID_MISMATCH');
            const aesKey=crypto.privateDecrypt({key:keyData.privateKey,padding:crypto.constants.RSA_PKCS1_OAEP_PADDING,oaepHash:'sha256'},Buffer.from(String(job.encryptedKey||''),'base64'));
            const iv=Buffer.from(String(job.iv||''),'base64');
            const all=Buffer.from(String(job.ciphertext||''),'base64');
            if(aesKey.length!==32||iv.length!==12||all.length<17) throw new Error('INVALID_ENCRYPTED_JOB');
            const tag=all.subarray(all.length-16);
            const ciphertext=all.subarray(0,all.length-16);
            const decipher=crypto.createDecipheriv('aes-256-gcm',aesKey,iv);
            decipher.setAuthTag(tag);
            const clear=Buffer.concat([decipher.update(ciphertext),decipher.final()]);
            return {parsed:JSON.parse(clear.toString('utf8')),keyRef:keyDoc.ref,keyId:keyData.keyId};
          }

          function profilePayload(u){
            const role=String(u.rol||'').trim();
            const consulta=['Visor provincial AME','Visor zonal AME','Consulta provincial AME'].includes(role);
            return {correo:norm(u.correo),email:norm(u.correo),nombre:String(u.nombre||'').trim(),rol:role,codigoRol:role,provincia:String(u.provincia||'').trim(),canton:String(u.canton||'').trim(),nivelAcceso:String(u.nivelAcceso||'').trim(),scopeKeys:Array.isArray(u.scopeKeys)?[...new Set(u.scopeKeys.map(String))]:[],estado:'Activo',modoAcceso:consulta?'Consulta':'Operación',invitacionEstado:'PilotoActivo',requiereCambioClave:false,metodoActivacion:'Credencial inicial administrada',actualizadoEn:admin.firestore.FieldValue.serverTimestamp(),actualizadoPor:'credential-sync-admin-sdk'};
          }

          async function legacyProfiles(email){
            const found=new Map();
            for(const field of ['correo','email']){
              const snap=await db.collection('perfiles').where(field,'==',email).limit(20).get();
              snap.docs.forEach(doc=>found.set(doc.id,doc));
            }
            return [...found.values()];
          }

          async function verifyPassword(email,password){
            const url=`https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${process.env.FIREBASE_WEB_API_KEY}`;
            let last='unknown';
            for(let attempt=0;attempt<3;attempt++){
              const response=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email,password,returnSecureToken:true})});
              if(response.ok) return true;
              const body=await response.json().catch(()=>({}));
              last=body?.error?.message||`HTTP_${response.status}`;
              await sleep(400*(attempt+1));
            }
            throw new Error(`PASSWORD_LOGIN_VERIFICATION_FAILED:${last}`);
          }

          (async()=>{
            const jobRef=db.collection('migraciones').doc('credential-sync-current');
            const snap=await jobRef.get();
            if(!snap.exists){console.log(JSON.stringify({status:'idle',reason:'no_job'}));return;}
            const job=snap.data()||{};
            if(job.status!=='pending'){console.log(JSON.stringify({status:'idle',reason:`job_${job.status||'unknown'}`}));return;}
            if(job.type!=='credential-sync-46'||Number(job.recordCount)!==46) throw new Error('INVALID_JOB_HEADER');

            const {parsed,keyRef,keyId}=await decryptJob(job);
            const users=Array.isArray(parsed)?parsed:parsed?.users;
            if(!Array.isArray(users)||users.length!==46) throw new Error('EXPECTED_EXACTLY_46_USERS');
            const emails=users.map(u=>norm(u.correo));
            if(new Set(emails).size!==46) throw new Error('DUPLICATE_EMAILS');
            for(const u of users){
              const email=norm(u.correo);const password=String(u.claveInicial||u.password||'').trim();const role=String(u.rol||'').trim();
              if(!email||password.length<12||!supportedRoles.has(role)||!Array.isArray(u.scopeKeys)||!u.scopeKeys.length) throw new Error(`INVALID_BATCH_ROW:${hash(email)}`);
            }

            let created=0,updated=0,profilesWritten=0,legacyRemoved=0,passwordVerified=0;
            const failures=[];const verifiedHashes=[];
            for(const u of users){
              const email=norm(u.correo);const password=String(u.claveInicial||u.password||'').trim();
              try{
                let account;
                try{
                  account=await auth.getUserByEmail(email);
                  account=await auth.updateUser(account.uid,{password,displayName:String(u.nombre||'').trim(),disabled:false});
                  updated++;
                }catch(err){
                  if(err?.code==='auth/user-not-found'){
                    account=await auth.createUser({email,password,displayName:String(u.nombre||'').trim(),disabled:false});
                    created++;
                  }else throw err;
                }
                const legacy=await legacyProfiles(email);
                await db.collection('perfiles').doc(account.uid).set(profilePayload(u),{merge:true});
                profilesWritten++;
                for(const doc of legacy){if(doc.id!==account.uid){await doc.ref.delete();legacyRemoved++;}}
                const checkAuth=await auth.getUserByEmail(email);
                const checkProfile=await db.collection('perfiles').doc(checkAuth.uid).get();
                if(!checkProfile.exists) throw new Error('PROFILE_NOT_FOUND');
                const p=checkProfile.data()||{};
                if(norm(p.correo||p.email)!==email) throw new Error('PROFILE_EMAIL_MISMATCH');
                if(String(p.rol||'')!==String(u.rol||'')) throw new Error('PROFILE_ROLE_MISMATCH');
                if(p.requiereCambioClave!==false) throw new Error('FORCED_CHANGE_NOT_DISABLED');
                const expected=[...new Set((u.scopeKeys||[]).map(String))].sort();
                const actual=[...new Set((p.scopeKeys||[]).map(String))].sort();
                if(JSON.stringify(expected)!==JSON.stringify(actual)) throw new Error('PROFILE_SCOPE_MISMATCH');
                await verifyPassword(email,password);
                passwordVerified++;
                verifiedHashes.push(hash(email));
                await sleep(80);
              }catch(err){failures.push({emailHash:hash(email),code:String(err?.code||err?.message||err).slice(0,180)});}
            }

            const ok=failures.length===0&&verifiedHashes.length===46&&passwordVerified===46;
            const result={product:'SmartRisk CZ5',projectId:process.env.FIREBASE_PROJECT_ID,checkedAt:new Date().toISOString(),targetCount:46,created,updated,profilesWritten,legacyProfilesRemoved:legacyRemoved,passwordLoginVerified:passwordVerified,verified:verifiedHashes.length,failureCount:failures.length,failures,targetEmailHashes:verifiedHashes.sort(),policy:{login:'email + administrator-prepared password',activationEmailRequired:false,forcedFirstPasswordChange:false},privacy:'No plaintext emails, names, UIDs or passwords are stored in this report.',status:ok?'success':'failed'};
            fs.writeFileSync('CREDENTIAL_SYNC_RESULT.json',JSON.stringify(result,null,2)+'\n');
            if(!ok){
              await jobRef.set({status:'failed',type:'credential-sync-46',recordCount:46,failureCount:failures.length,verified:verifiedHashes.length,updatedAt:admin.firestore.FieldValue.serverTimestamp(),failures},{merge:true});
              throw new Error(`SYNC_INCOMPLETE verified=${verifiedHashes.length} failures=${failures.length}`);
            }
            await jobRef.set({status:'success',type:'credential-sync-46',recordCount:46,created,updated,verified:46,passwordLoginVerified:46,completedAt:admin.firestore.FieldValue.serverTimestamp(),policy:'direct-managed-credentials'});
            await keyRef.delete();
            console.log(JSON.stringify({status:'success',target:46,created,updated,verified:46,passwordLoginVerified:46,oneTimePrivateKeyDeleted:true,keyId}));
          })().catch(e=>{console.error('CREDENTIAL_SYNC_FAILED',e?.code||e?.message||e);process.exit(1)});
          NODE
      - name: Commit sanitized synchronization result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f CREDENTIAL_SYNC_RESULT.json ]; then exit 0; fi
          git config user.name "SmartRisk Credential Sync Bot"
          git config user.email "actions@users.noreply.github.com"
          git add CREDENTIAL_SYNC_RESULT.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record SmartRisk credential synchronization result"
          git push origin HEAD:main
      - name: Upload sanitized result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: credential-sync-result-${{ github.run_id }}
          path: CREDENTIAL_SYNC_RESULT.json
          retention-days: 2
          if-no-files-found: ignore
