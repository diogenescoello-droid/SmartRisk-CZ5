<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SmartRisk Consultoría</title>
<style>
:root{--bg:#f3f6f8;--panel:#fff;--soft:#f8fafb;--text:#17232c;--muted:#687781;--line:#dbe3e7;--accent:#176b87;--accent2:#0e526b;--ok:#247553;--warn:#a66b00;--danger:#9e3b3b;--shadow:0 10px 28px rgba(17,42,54,.08);--r:16px}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}button,input,select{font:inherit}.top{position:sticky;top:0;z-index:20;background:#102f3e;color:white;padding:13px 20px;display:flex;gap:14px;align-items:center;justify-content:space-between;box-shadow:0 5px 18px rgba(0,0,0,.12)}.brand{display:flex;gap:10px;align-items:center}.mark{width:42px;height:42px;border-radius:13px;background:#fff;color:#123746;display:grid;place-items:center;font-weight:800}.brand span{display:block;font-size:12px;opacity:.75;margin-top:2px}.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.pill{border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:6px 10px;font-size:12px}.shell{max-width:1460px;margin:0 auto;padding:18px}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.kpi{padding:14px}.kpi small,.muted{color:var(--muted);font-size:12px}.kpi strong{display:block;font-size:23px;margin:4px 0}.filters{margin-top:12px;padding:13px;display:flex;gap:9px;flex-wrap:wrap;align-items:end}.field{display:block;min-width:155px}.field.search{flex:1;min-width:230px}.field span{display:block;color:var(--muted);font-size:11px;margin-bottom:4px}.field input,.field select{width:100%;border:1px solid var(--line);border-radius:10px;background:white;padding:9px 11px;outline:0}.field input:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px #e5f0f4}.chips{width:100%;display:flex;gap:7px;flex-wrap:wrap;margin-top:2px}.chip,.btn,.navbtn,.tab{border:1px solid var(--line);background:white;border-radius:10px;padding:8px 11px;cursor:pointer;color:var(--text)}.chip{border-radius:999px;font-size:12px}.chip.active,.tab.active,.navbtn.active{background:var(--accent);border-color:var(--accent);color:#fff}.btn.primary{background:var(--accent);border-color:var(--accent);color:white}.workspace{display:grid;grid-template-columns:210px minmax(0,1fr);gap:12px;margin-top:12px}.side{padding:8px;height:max-content;position:sticky;top:82px}.navbtn{width:100%;border-color:transparent;background:transparent;display:flex;justify-content:space-between;text-align:left;margin-bottom:3px}.navbtn.active{background:#e9f3f6;color:var(--accent2);border-color:#d7e7ed}.project-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.project{padding:13px;cursor:pointer;transition:.15s;text-align:left}.project:hover{transform:translateY(-1px);border-color:#9dbac5}.project.active{outline:2px solid var(--accent);outline-offset:1px}.row{display:flex;justify-content:space-between;gap:9px;align-items:center}.code{font-size:10px;color:var(--muted)}.place{font-weight:750;margin-top:2px}.badge{font-size:10px;padding:4px 7px;border-radius:999px;background:#e8f2f5;white-space:nowrap}.progress{height:8px;background:#e7edef;border-radius:99px;overflow:hidden;margin-top:9px}.progress i{display:block;height:100%;background:var(--accent)}.project .service{font-size:11px;color:var(--muted);min-height:28px;margin-top:7px}.project .meta{font-size:11px;margin-top:8px}.main{padding:15px;margin-top:11px;min-height:410px}.panel-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}.panel-title{font-size:18px;font-weight:760}.panel-sub{font-size:12px;color:var(--muted);margin-top:2px}.panel-actions{display:flex;gap:7px;flex-wrap:wrap}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:13px 0}.metric{border:1px solid var(--line);background:var(--soft);border-radius:12px;padding:11px}.metric small{display:block;color:var(--muted)}.metric strong{display:block;font-size:18px;margin-top:3px}.detail{display:grid;grid-template-columns:1fr 1fr;gap:11px}.box{border:1px solid var(--line);border-radius:13px;padding:12px}.box h3{font-size:13px;margin:0 0 8px}.listrow{display:flex;justify-content:space-between;gap:9px;align-items:center;border-bottom:1px solid var(--line);padding:9px 0;font-size:12px}.listrow:last-child{border-bottom:0}.listrow small{display:block;color:var(--muted);margin-top:2px}.callout{border:1px solid #d4e5eb;background:#edf6f8;border-radius:11px;padding:10px;font-size:12px}.callout.warn{background:#fff7e8;border-color:#edd8a8}.callout.ok{background:#edf8f2;border-color:#cbe5d7}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:11px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{padding:8px;border-bottom:1px solid var(--line);text-align:left}.table th{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.04em}.status{font-size:10px;border-radius:999px;padding:4px 7px;background:#eef2f4}.status.warn{background:#fff3d9;color:#8a5800}.status.bad{background:#fff0f0;color:var(--danger)}.status.ok{background:#eaf7f0;color:var(--ok)}.risk{display:grid;grid-template-columns:1.5fr .5fr .5fr .7fr .5fr;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:12px}.score{width:32px;height:32px;display:grid;place-items:center;border-radius:50%;background:#fff3d9;font-weight:700}.score.high{background:#fff0f0;color:var(--danger)}.bar{height:9px;border-radius:99px;background:#e6ecef;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}.modal{position:fixed;inset:0;display:none;z-index:40}.modal.open{display:block}.back{position:absolute;inset:0;background:rgba(12,27,34,.42)}.modal-card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;width:min(760px,94vw);max-height:90vh;overflow:auto;border-radius:18px;box-shadow:0 25px 70px rgba(0,0,0,.22)}.modal-head,.modal-foot{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px}.modal-head{border-bottom:1px solid var(--line)}.modal-foot{border-top:1px solid var(--line)}.modal-body{padding:16px}.wizard{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}.step{font-size:11px;text-align:center;background:#f0f3f5;padding:8px;border-radius:9px}.step.active{background:var(--accent);color:white}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.notice{font-size:11px;color:#dbe7eb}.mode{color:#dff5e8}.hidden{display:none!important}@media(max-width:1120px){.project-grid{grid-template-columns:repeat(2,1fr)}.kpis{grid-template-columns:repeat(3,1fr)}}@media(max-width:780px){.top{position:static}.workspace{grid-template-columns:1fr}.side{position:static;display:flex;overflow:auto;gap:5px}.navbtn{min-width:max-content}.project-grid,.detail,.metrics,.formgrid{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}.risk{grid-template-columns:1fr 1fr}.shell{padding:11px}}@media(max-width:480px){.kpis{grid-template-columns:1fr}.project-grid{grid-template-columns:1fr}.wizard{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header class="top"><div class="brand"><div class="mark">SR</div><div><strong>SmartRisk Consultoría</strong><span>Control técnico · contractual · económico</span></div></div><div class="top-actions"><span class="pill mode">● Publicado · modo evaluación</span><label class="field" style="min-width:185px"><span style="color:#cfe0e6">Vista de rol</span><select id="role"></select></label><button class="btn primary" id="newBtn">＋ Nuevo proyecto</button></div></header>
<main class="shell"><section class="kpis" id="kpis"></section><section class="filters card"><label class="field search"><span>Buscar proyecto, GAD, cantón o código</span><input id="q" placeholder="Ej. Salinas, MZS-2026..."></label><label class="field"><span>Provincia</span><select id="province"></select></label><label class="field"><span>Etapa</span><select id="stage"></select></label><div class="chips"><button class="chip active" data-filter="all">Todos</button><button class="chip" data-filter="attention">Atención</button><button class="chip" data-filter="execution">En ejecución</button><button class="chip" data-filter="economics">Con presupuesto</button></div></section><section class="workspace"><aside class="side card" id="nav"></aside><section><div id="projects" class="project-grid"></div><div id="main" class="main card"></div></section></section></main>
<div class="modal" id="modal"><div class="back" data-close></div><section class="modal-card"><div class="modal-head"><div><strong>Nuevo proyecto</strong><div class="muted">Cliente → Territorio → Servicio → Presupuesto</div></div><button class="btn" data-close>✕</button></div><div class="modal-body"><div class="wizard" id="steps"></div><div id="wizardBody"></div></div><div class="modal-foot"><button class="btn" id="backBtn">Atrás</button><button class="btn primary" id="nextBtn">Continuar</button></div></section></div>
<script>
const roles={gerencia:{label:'Gerencia',econ:1,tasks:['Aprobar presupuesto V03','Resolver alerta contractual','Revisar margen actualizado']},comercial:{label:'Comercial / Promoción',econ:0,tasks:['Registrar seguimiento con GAD','Actualizar probabilidad','Programar próximo contacto']},tecnico:{label:'Coordinación técnica',econ:1,tasks:['Validar campaña','Asignar especialistas','Revisar avance técnico']},geotecnia:{label:'Geotecnia',econ:0,tasks:['Completar perforación P-07','Validar cadena de custodia','Revisar laboratorio']},geofisica:{label:'Geofísica',econ:0,tasks:['Procesar VS-14','Repetir HVSR H-17','Cerrar QA instrumental']},contractual:{label:'Gestión contractual',econ:1,tasks:['Controlar plazo','Verificar garantía','Preparar planilla']},finanzas:{label:'Finanzas',econ:1,tasks:['Registrar costo','Conciliar anticipo','Actualizar margen']},qaqc:{label:'QA/QC',econ:0,tasks:['Revisar informe V05','Cerrar observaciones','Aprobar cartografía']}};
const data=[{id:'salinas',code:'MZS-2026-SALINAS-001',province:'Santa Elena',canton:'Salinas',stage:'Oferta',service:'Microzonificación sísmica integral',price:285366,cost:214843,committed:78000,actual:31420,gate:'G4',progress:80,req:'8 de 10',alerts:['Oferta pendiente de QA/QC','Garantía por definir']},{id:'daule',code:'MZS-2026-DAULE-002',province:'Guayas',canton:'Daule',stage:'Prefactibilidad',service:'Estudio técnico base',price:198500,cost:151300,committed:8500,actual:3200,gate:'G2',progress:71,req:'5 de 7',alerts:['Área PDOT/PUGS pendiente']},{id:'milagro',code:'MZS-2026-MILAGRO-003',province:'Guayas',canton:'Milagro',stage:'Ejecución',service:'Microzonificación sísmica integral',price:322400,cost:249700,committed:171200,actual:126350,gate:'G6',progress:100,req:'9 de 9',alerts:['HVSR H-17 requiere repetición','Costo de campo al 78%']},{id:'babahoyo',code:'MZS-2026-BABAHOYO-004',province:'Los Ríos',canton:'Babahoyo',stage:'Oportunidad',service:'Prefactibilidad de microzonificación',price:0,cost:0,committed:0,actual:0,gate:'G1',progress:50,req:'2 de 4',alerts:['Presupuesto referencial pendiente']}];
const gates=[['G0','Prospección'],['G1','Oportunidad'],['G2','Prefactibilidad'],['G3','Diseño técnico-económico'],['G4','Oferta'],['G5','Contratación'],['G6','Campo'],['G7','Procesamiento'],['G8','Entrega'],['G9','Recepción y cobro'],['G10','Cierre / postventa']];
const s={role:'gerencia',selected:'salinas',section:'panel',province:'Todas',stage:'Todas',q:'',filter:'all',wizard:0};const $=x=>document.getElementById(x);const money=v=>new Intl.NumberFormat('es-EC',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(v||0);const project=()=>data.find(x=>x.id===s.selected)||data[0];const margin=p=>p.price?((p.price-p.cost)/p.price*100):0;
function visible(){let x=[...data];if(s.province!=='Todas')x=x.filter(p=>p.province===s.province);if(s.stage!=='Todas')x=x.filter(p=>p.stage===s.stage);if(s.q){const q=s.q.toLowerCase();x=x.filter(p=>(p.code+' '+p.canton+' '+p.province+' '+p.service).toLowerCase().includes(q))}if(s.filter==='attention')x=x.filter(p=>p.alerts.length);if(s.filter==='execution')x=x.filter(p=>p.stage==='Ejecución');if(s.filter==='economics')x=x.filter(p=>p.price>0);return x}
function init(){Object.entries(roles).forEach(([k,r])=>$('role').insertAdjacentHTML('beforeend',`<option value="${k}">${r.label}</option>`));['Todas',...new Set(data.map(p=>p.province))].forEach(x=>$('province').insertAdjacentHTML('beforeend',`<option>${x}</option>`));['Todas',...new Set(data.map(p=>p.stage))].forEach(x=>$('stage').insertAdjacentHTML('beforeend',`<option>${x}</option>`));}
function renderKpis(){const x=visible(),r=roles[s.role],portfolio=x.reduce((a,p)=>a+p.price,0),cost=x.reduce((a,p)=>a+p.cost,0),alerts=x.reduce((a,p)=>a+p.alerts.length,0);$('kpis').innerHTML=[['Proyectos visibles',x.length,`${x.filter(p=>p.alerts.length).length} con alertas`],['Mis acciones',r.tasks.length,r.label],['Cartera',r.econ?money(portfolio):'Restringido','ofertas + contratos'],['Margen',r.econ&&portfolio?((portfolio-cost)/portfolio*100).toFixed(1)+'%':'Restringido','cartera visible'],['Alertas',alerts,'técnicas · contractuales · económicas']].map(([a,b,c])=>`<article class="kpi card"><small>${a}</small><strong>${b}</strong><small>${c}</small></article>`).join('')}
function renderNav(){const items=[['panel','▦','Panel'],['acciones','✓','Mis acciones'],['control','◆','Control / Gates'],['operacion','⚙','Operación técnica'],['direccion','◉','Dirección'],['documentos','▤','Documentos'],['alertas','⚠','Alertas']];$('nav').innerHTML=items.map(x=>`<button class="navbtn ${s.section===x[0]?'active':''}" data-sec="${x[0]}"><span>${x[1]} ${x[2]}</span><span>${x[0]==='alertas'?project().alerts.length:'›'}</span></button>`).join('');document.querySelectorAll('[data-sec]').forEach(b=>b.onclick=()=>{s.section=b.dataset.sec;renderNav();renderMain()})}
function renderProjects(){const x=visible();$('projects').innerHTML=x.length?x.map(p=>`<button class="project card ${p.id===s.selected?'active':''}" data-p="${p.id}"><div class="row"><div><div class="code">${p.code}</div><div class="place">${p.canton}</div></div><span class="badge">${p.stage}</span></div><div class="service">${p.service}</div><div class="row meta"><span>${p.gate}</span><strong>${roles[s.role].econ?(p.price?money(p.price):'Por definir'):'Interno'}</strong></div><div class="progress"><i style="width:${p.progress}%"></i></div><div class="row meta"><span>${p.progress}% Gate</span><span>${p.alerts.length?'⚠ '+p.alerts.length:'✓'}</span></div></button>`).join(''):'<div class="card" style="padding:22px">Sin proyectos con estos filtros.</div>';document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{s.selected=b.dataset.p;renderAll()})}
const head=(title,sub)=>`<div class="panel-head"><div><div class="panel-title">${title}</div><div class="panel-sub">${sub}</div></div><div class="panel-actions"><button class="btn">Ver expediente</button><button class="btn primary">Abrir acción</button></div></div>`;function metrics(p){const e=roles[s.role].econ;return `<div class="metrics"><div class="metric"><small>Oferta / contrato</small><strong>${e?money(p.price):'Restringido'}</strong></div><div class="metric"><small>Costo previsto</small><strong>${e?money(p.cost):'Restringido'}</strong></div><div class="metric"><small>Margen</small><strong>${e?(p.price?margin(p).toFixed(1)+'%':'—'):'Restringido'}</strong></div><div class="metric"><small>Gate</small><strong>${p.gate}</strong></div></div>`}
function panel(p){return head(p.code+' · '+p.canton,p.service)+metrics(p)+`<div class="detail"><div class="box"><h3>Avance del Gate</h3><div class="progress"><i style="width:${p.progress}%"></i></div><div class="row meta"><span>${p.req} requisitos</span><strong>${p.progress}%</strong></div><div class="callout ${p.progress===100?'ok':'warn'}" style="margin-top:9px">${p.progress===100?'Gate operativo aprobado. Continúa seguimiento.':p.alerts[0]||'Pendiente de revisión.'}</div></div><div class="box"><h3>Próximas acciones · ${roles[s.role].label}</h3>${roles[s.role].tasks.map((t,i)=>`<div class="listrow"><div><strong>${t}</strong><small>${i===0?'Prioridad alta':'Pendiente'}</small></div><button class="btn">Abrir</button></div>`).join('')}</div></div>`}
function actions(p){return head('Mi bandeja de acción',roles[s.role].label+' · '+p.code)+`<div class="box" style="margin-top:12px">${roles[s.role].tasks.map((t,i)=>`<div class="listrow"><div><span class="badge">${i===0?'Alta':'Normal'}</span> <strong>${t}</strong><small>${p.canton} · ${p.gate}</small></div><button class="btn primary">Gestionar</button></div>`).join('')}</div>`}
function control(p){const gi=gates.findIndex(g=>g[0]===p.gate);const req=['Alcance validado','Presupuesto vigente','Cronograma','Responsable asignado','Evidencia documental','QA/QC'];return head('Centro de Control y Cumplimiento',p.code)+`<div class="tabs" style="margin-top:12px"><button class="tab active">Gate actual</button><button class="tab">Cronograma</button><button class="tab">Documentos</button></div><div class="detail"><div class="box"><h3>${p.gate} · ${gates[gi][1]}</h3>${req.map((x,i)=>`<div class="listrow"><span>${i<p.progress/17?'✓':'○'} ${x}</span><span class="status ${i<p.progress/17?'ok':'warn'}">${i<p.progress/17?'Cumple':'Pendiente'}</span></div>`).join('')}<div class="callout warn" style="margin-top:8px">No se habilita el siguiente Gate mientras exista un requisito crítico pendiente.</div></div><div class="box"><h3>Ruta G0–G10</h3>${gates.map((g,i)=>`<div class="listrow"><span>${g[0]} · ${g[1]}</span><span class="status ${i<gi?'ok':i===gi?'warn':''}">${i<gi?'Cerrado':i===gi?'Actual':'Futuro'}</span></div>`).join('')}</div></div>`}
function operation(p){const bore=[['P-01','Centro',25,25,12,4,'Completada'],['P-07','Norte',30,21,8,3,'En proceso'],['P-12','Expansión',25,0,0,0,'Pendiente']];const geo=[['VS-14','Vs30','Sector Norte','Procesando'],['H-17','HVSR','Centro','Repetir'],['H-22','HVSR','Sur','Aprobado']];return head('Operación técnica',p.code)+`<div class="tabs" style="margin-top:12px"><button class="tab active">Perforaciones</button><button class="tab">Muestras / Lab</button><button class="tab">Geofísica</button><button class="tab">SIG / Modelación</button><button class="tab">QA/QC</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Punto</th><th>Sector</th><th>Plan</th><th>Ejecutado</th><th>SPT</th><th>Muestras</th><th>Estado</th></tr></thead><tbody>${bore.map(x=>`<tr><td><strong>${x[0]}</strong></td><td>${x[1]}</td><td>${x[2]} m</td><td>${x[3]} m</td><td>${x[4]}</td><td>${x[5]}</td><td><span class="status ${x[6]==='Completada'?'ok':'warn'}">${x[6]}</span></td></tr>`).join('')}</tbody></table></div><div class="box" style="margin-top:11px"><h3>Geofísica / QA instrumental</h3>${geo.map(x=>`<div class="listrow"><div><strong>${x[0]} · ${x[1]}</strong><small>${x[2]}</small></div><span class="status ${x[3]==='Aprobado'?'ok':x[3]==='Repetir'?'bad':'warn'}">${x[3]}</span></div>`).join('')}</div>`}
function direction(){const portfolio=data.reduce((a,p)=>a+p.price,0),cost=data.reduce((a,p)=>a+p.cost,0);const risks=[];data.forEach(p=>p.alerts.forEach((a,i)=>risks.push([p.canton,a,i?3:4,p.stage==='Ejecución'?4:3])));return head('Dirección y rentabilidad','Cartera · riesgos · capacidad · cobranza')+`<div class="metrics"><div class="metric"><small>Cartera</small><strong>${money(portfolio)}</strong></div><div class="metric"><small>Costo previsto</small><strong>${money(cost)}</strong></div><div class="metric"><small>Margen cartera</small><strong>${((portfolio-cost)/portfolio*100).toFixed(1)}%</strong></div><div class="metric"><small>Alertas</small><strong>${risks.length}</strong></div></div><div class="detail"><div class="box"><h3>Riesgos prioritarios</h3><div class="risk" style="color:var(--muted);font-size:10px"><span>Riesgo</span><span>P</span><span>I</span><span>Proyecto</span><span>Nivel</span></div>${risks.map(r=>{const sc=r[2]*r[3];return `<div class="risk"><span>${r[1]}</span><span>${r[2]}</span><span>${r[3]}</span><span>${r[0]}</span><span class="score ${sc>=16?'high':''}">${sc}</span></div>`}).join('')}</div><div class="box"><h3>Capacidad del equipo</h3>${[['Geotecnia',86],['Coordinación',78],['SIG',71],['QA/QC',67],['Geofísica',62],['Contractual',55]].map(x=>`<div class="listrow"><strong>${x[0]}</strong><div style="width:55%"><div class="bar"><i style="width:${x[1]}%"></i></div></div><span>${x[1]}%</span></div>`).join('')}<div class="callout warn" style="margin-top:8px"><strong>Cuello de botella: Geotecnia.</strong><br>Revisar capacidad antes de asumir otra campaña simultánea.</div></div></div>`}
function documents(p){return head('Gestión documental',p.code)+`<div class="box" style="margin-top:12px">${['TDR / Pliegos','Oferta técnica','Presupuesto vigente','Contrato / garantías','Plan de trabajo','Bitácoras de campo','Resultados laboratorio / geofísica','Informe técnico','Cartografía y bases','Acta de recepción'].map((d,i)=>`<div class="listrow"><div><strong>${d}</strong><small>Versión · responsable · fecha · evidencia</small></div><span class="status ${i<3?'ok':'warn'}">${i<3?'Vigente':'Pendiente'}</span></div>`).join('')}</div>`}
function alerts(p){return head('Centro de alertas',p.code)+`<div style="margin-top:12px">${p.alerts.map((a,i)=>`<div class="callout ${i?'':'warn'}" style="margin-bottom:8px"><strong>⚠ ${a}</strong><div class="muted">Debe tener responsable, fecha objetivo y evidencia de cierre.</div></div>`).join('')||'<div class="callout ok">Sin alertas abiertas.</div>'}</div>`}
function renderMain(){const p=project(),map={panel,acciones:actions,control,operacion:operation,direccion,direccion2:direction,documentos,alertas};$('main').innerHTML=(s.section==='direccion'?direction():map[s.section]?map[s.section](p):panel(p))}
function renderAll(){renderKpis();renderNav();renderProjects();renderMain()}
function wizard(){const labels=['Cliente','Territorio','Servicio','Presupuesto'];$('steps').innerHTML=labels.map((x,i)=>`<div class="step ${i===s.wizard?'active':''}">${i+1}. ${x}</div>`).join('');const body=[`<div class="formgrid"><label class="field"><span>Entidad / GAD</span><input placeholder="GAD Municipal de..."></label><label class="field"><span>Contacto principal</span><input placeholder="Nombre y cargo"></label><label class="field"><span>Correo</span><input type="email"></label><label class="field"><span>Teléfono</span><input></label></div>`,`<div class="formgrid"><label class="field"><span>Provincia</span><select><option>Guayas</option><option>Santa Elena</option><option>Los Ríos</option></select></label><label class="field"><span>Cantón</span><input placeholder="Cantón"></label><label class="field"><span>Área urbana (ha)</span><input type="number"></label><label class="field"><span>Expansión (ha)</span><input type="number"></label></div>`,`<div class="formgrid"><label class="field"><span>Servicio</span><select><option>Microzonificación sísmica integral</option><option>Estudio técnico base</option><option>Campaña geotécnica-geofísica</option></select></label><label class="field"><span>Complejidad</span><select><option>Baja</option><option>Media</option><option>Alta</option></select></label><label class="field"><span>Plazo (meses)</span><input value="4" type="number"></label><label class="field"><span>Técnicos</span><input value="4" type="number"></label></div>`,`<div class="callout"><strong>Motor paramétrico inicial</strong><div class="muted">Perforación USD 90/m · roca USD 200/m · Vs USD 700 · HVSR USD 300 · profesional USD 1.700/mes.</div></div><div class="metrics"><div class="metric"><small>Perforaciones</small><strong>20</strong></div><div class="metric"><small>Vs</small><strong>45</strong></div><div class="metric"><small>HVSR</small><strong>40</strong></div><div class="metric"><small>Plazo</small><strong>4 meses</strong></div></div>`];$('wizardBody').innerHTML=body[s.wizard];$('backBtn').disabled=s.wizard===0;$('nextBtn').textContent=s.wizard===3?'Crear borrador':'Continuar'}
init();$('role').onchange=e=>{s.role=e.target.value;renderAll()};$('province').onchange=e=>{s.province=e.target.value;renderAll()};$('stage').onchange=e=>{s.stage=e.target.value;renderAll()};$('q').oninput=e=>{s.q=e.target.value;renderAll()};document.querySelector('.chips').onclick=e=>{const b=e.target.closest('[data-filter]');if(!b)return;s.filter=b.dataset.filter;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x===b));renderAll()};$('newBtn').onclick=()=>{s.wizard=0;$('modal').classList.add('open');wizard()};document.querySelectorAll('[data-close]').forEach(x=>x.onclick=()=> $('modal').classList.remove('open'));$('backBtn').onclick=()=>{if(s.wizard){s.wizard--;wizard()}};$('nextBtn').onclick=()=>{if(s.wizard<3){s.wizard++;wizard()}else{$('modal').classList.remove('open');alert('Borrador preparado en modo evaluación. La persistencia privada se habilita después de validar las reglas de Firestore.')}};renderAll();
</script>
